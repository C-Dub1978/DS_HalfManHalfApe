name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:

jobs:
  ci:
    name: npm run ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  install-matrix:
    name: install matrix (@angular/cli@${{ matrix.angular-cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor (invariant 1) plus every major inside the peer range
        # declared in libs/ui/package.json — one entry per supported major,
        # not just floor + latest, so a middle major can't regress unseen.
        # Add a new major here in the same change that raises the peer
        # range ceiling in CLAUDE.md / libs/ui/package.json (fork 33).
        angular-cli: ['20', '21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/verify-install-matrix.sh ${{ matrix.angular-cli }}
